services:
  mysql:
    image: mysql:8.0
    container_name: servora_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-servora_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-servora}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-servora_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - servora_mysql_data:/var/lib/mysql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servora_api
    restart: unless-stopped
    ports:
      - "${API_EXTERNAL_PORT:-5000}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__db_host: mysql
      Database__db_port: 3306
      Database__db_user: ${DB_USER:-root}
      Database__db_password: ${DB_PASSWORD:-servora_dev_password}
      Database__db_name: ${DB_NAME:-servora}
      TimeZone__Default: ${DEFAULT_TIMEZONE:-Asia/Jakarta}
      SeedData__RunOnStartup: ${SEED_RUN_ON_STARTUP:-true}
      SeedData__IncludeSimulationData: ${SEED_INCLUDE_DEMO_DATA:-false}
      SeedData__Admin__Email: ${ADMIN_EMAIL:-admin@example.com}
      SeedData__Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
      SeedData__Admin__FirstName: ${ADMIN_FIRST_NAME:-System}
      SeedData__Admin__LastName: ${ADMIN_LAST_NAME:-Admin}
      Jwt__Issuer: ${JWT_ISSUER:-ServoraApi}
      Jwt__Audience: ${JWT_AUDIENCE:-ServoraClients}
      Jwt__Key: ${JWT_KEY:-change-me-to-a-long-random-secret-key-at-least-32-chars}
      Security__SecretEncryptionKey: ${SECRET_ENCRYPTION_KEY:-}
      PublicFrontendBaseUrl: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://127.0.0.1:3000
      Cors__AllowedOrigins__2: http://localhost:5173
      Cors__AllowedOrigins__3: http://127.0.0.1:5173
      Cors__AllowedOrigins__4: http://${APP_HOST:-localhost}:3000
      Cors__AllowedOrigins__5: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:3000}
    volumes:
      - servora_uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servora_web
    restart: unless-stopped
    ports:
      - "${WEB_EXTERNAL_PORT:-3000}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ORIGIN: ${PUBLIC_FRONTEND_BASE_URL:-http://localhost:3000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:5000/api/v1}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8080/api/v1}
      PORT: 3000
      NODE_ENV: production
      BODY_SIZE_LIMIT: 25M
    depends_on:
      - api

volumes:
  servora_mysql_data:
  servora_uploads_data:
